name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/knock-knock-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/knock-knock-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to ACA
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp up \
              --name knock-knock-backend \
              --resource-group KnockKnock-RG \
              --environment KnockKnock-Env \
              --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/knock-knock-backend:latest \
              --target-port 8000 \
              --ingress external

      - name: Deploy Frontend to ACA
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp up \
              --name knock-knock-frontend \
              --resource-group KnockKnock-RG \
              --environment KnockKnock-Env \
              --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/knock-knock-frontend:latest \
              --target-port 80 \
              --ingress external
